<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Captured By Our Loved Ones</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/guest-memories.css">

</head>
<body>

<!-- ========================= -->
<!-- HERO -->
<!-- ========================= -->

<header class="hero">

    <div class="overlay"></div>

    <div class="hero-content">

        <h1>Captured By Our Loved Ones</h1>

        <p>
            Every smile, every laugh, every beautiful moment—
            captured through your eyes.
        </p>

        <button id="uploadBtn" class="upload-btn">

            📸 Upload Photo

        </button>

    </div>

</header>


<!-- ========================= -->
<!-- GALLERY -->
<!-- ========================= -->

<section class="gallery-section">

    <div class="gallery-header">

        <h2>Wedding Gallery</h2>

        <p>
            Share your favorite moments with everyone.
        </p>

    </div>


    <div id="gallery" class="gallery-grid">

        <!-- Photo Card -->

        <div class="photo-card">

            <img
                src="https://picsum.photos/600?random=1"
                alt="photo">

            <div class="photo-info">

                <div class="photo-top">

                    <span class="guest-name">
                        Wedding Guest
                    </span>

                </div>

                <div class="photo-bottom">

                    <button class="like-btn">

                        ❤

                        <span>18</span>

                    </button>

                </div>

            </div>

        </div>


        <div class="photo-card">

            <img
                src="https://picsum.photos/600?random=2"
                alt="photo">

            <div class="photo-info">

                <div class="photo-top">

                    <span class="guest-name">
                        Wedding Guest
                    </span>

                </div>

                <div class="photo-bottom">

                    <button class="like-btn">

                        ❤

                        <span>7</span>

                    </button>

                </div>

            </div>

        </div>


        <div class="photo-card">

            <img
                src="https://picsum.photos/600?random=3"
                alt="photo">

            <div class="photo-info">

                <div class="photo-top">

                    <span class="guest-name">
                        Wedding Guest
                    </span>

                </div>

                <div class="photo-bottom">

                    <button class="like-btn">

                        ❤

                        <span>12</span>

                    </button>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- ========================= -->
<!-- UPLOAD MODAL -->
<!-- ========================= -->

<div id="uploadModal" class="modal">

    <div class="modal-content">

        <button id="closeModal" class="close">

            &times;

        </button>

        <h2>Upload Your Photo</h2>

        <form id="uploadForm">

            <div class="form-group">

                <label>

                    Your Name (Optional)

                </label>

                <input
                    type="text"
                    id="guestName"
                    maxlength="40"
                    placeholder="Wedding Guest">

            </div>


            <div class="form-group">

                <label>

                    Caption (Optional)

                </label>

                <textarea
                    id="caption"
                    rows="3"
                    maxlength="150"
                    placeholder="Write something..."></textarea>

            </div>


            <div class="form-group">

                <label>

                    Choose Photo

                </label>

                <input
                    type="file"
                    id="photoInput"
                    accept="image/*">

            </div>


            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">

                </div>

            </div>

            <button
                type="submit"
                class="submit-btn">

                Upload Photo

            </button>

        </form>

    </div>

</div>



<!-- ========================= -->
<!-- LIGHTBOX -->
<!-- ========================= -->

<div id="lightbox" class="lightbox">

    <span id="closeLightbox" class="lightbox-close">

        &times;

    </span>

    <img
        id="lightboxImage"
        src=""
        alt="">

</div>



<!-- ========================= -->
<!-- TOAST -->
<!-- ========================= -->

<div id="toast" class="toast">

    Photo uploaded successfully ❤️

</div>



<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script type="module" src="js/firebase-config.js"></script>

<script type="module" src="js/upload.js"></script>

<script type="module" src="js/gallery.js"></script>

<script type="module" src="js/likes.js"></script>


<!-- ========================= -->
<!-- TEMP MODAL -->
<!-- ========================= -->

<script>

const uploadBtn=document.getElementById("uploadBtn");
const modal=document.getElementById("uploadModal");
const closeModal=document.getElementById("closeModal");

uploadBtn.onclick=()=>{

    modal.style.display="flex";

};

closeModal.onclick=()=>{

    modal.style.display="none";

};

window.onclick=(e)=>{

    if(e.target===modal){

        modal.style.display="none";

    }

};

</script>

</body>
</html>
