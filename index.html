<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afif & Windi Wedding</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family: Georgia, serif;
    overflow:hidden;

}


/* PAGE */

.page{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

}


/* PAGE 1 */

#page1{

    background:#fff8f0;

}


.cover h1{

    font-size:50px;
    color:#6b5138;

}


.cover p{

    margin:25px 0 40px;

    font-size:22px;

    color:#8b7355;

}



button{

    padding:18px 45px;

    border:none;

    border-radius:50px;

    background:#6b5138;

    color:white;

    font-size:18px;

    cursor:pointer;

}



/* PAGE 2 */

#page2{

    display:none;

    background:#fffaf5;

}


.content h1{

    font-size:55px;

    color:#6b5138;

}


.content p{

    margin-top:25px;

    font-size:20px;

    color:#8b7355;

}


.music-icon{

    margin-top:40px;

    font-size:50px;

    animation:spin 3s linear infinite;

}



@keyframes spin{

from{
    transform:rotate(0deg);
}

to{
    transform:rotate(360deg);
}

}


#muteBtn{

    margin-top:30px;

    background:#8b7355;

    font-size:14px;

    padding:10px 25px;

}



</style>


</head>



<body>


<!-- PAGE 1 -->

<div id="page1" class="page">


<div class="cover">


<h1>
Wedding Invitation
</h1>


<p>
The Wedding Of<br>
<strong>Afif & Windi</strong>
</p>


<button onclick="openInvitation()">

💌 Open Invitation

</button>


</div>


</div>





<!-- PAGE 2 -->

<div id="page2" class="page">


<div class="content">


<h1>
Afif & Windi
</h1>


<p>
Together With Love
</p>


<div class="music-icon">
🎵
</div>


<button id="muteBtn" onclick="toggleMusic()">
🔊 Mute
</button>


</div>


</div>





<!-- AUDIO JANGAN DIPINDAH -->

<audio id="music" loop preload="auto">

<source src="Timur.mp3" type="audio/mpeg">

</audio>




<script>


const music = document.getElementById("music");



function openInvitation(){


    // mulai musik setelah user klik

    music.volume = 1;


    music.play()
    .then(()=>{

        console.log("Music started");

    })
    .catch(error=>{

        console.log(error);

    });



    // hanya sembunyikan page 1

    document.getElementById("page1").style.display="none";


    // tampilkan page 2

    document.getElementById("page2").style.display="flex";


}





function toggleMusic(){


    if(music.paused){

        music.play();

        document.getElementById("muteBtn").innerHTML="🔊 Mute";

    }

    else{

        music.pause();

        document.getElementById("muteBtn").innerHTML="🔇 Play";

    }


}



</script>



</body>

</html>
