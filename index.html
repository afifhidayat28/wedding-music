<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RSVP</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#faf7f2;
    font-family:'Poppins', sans-serif;
}

.rsvp-card{
    max-width:420px;
    margin:auto;
    background:white;
    padding:35px 30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    font-family:'Playfair Display', serif;
    font-size:32px;
    margin-bottom:10px;
    color:#485331;
}

.subtitle{
    text-align:center;
    font-size:13px;
    color:#777;
    margin-bottom:30px;
}


label{
    font-size:14px;
    color:#555;
    display:block;
    margin-bottom:8px;
}


input,
textarea,
select{

    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:14px;
    outline:none;
    margin-bottom:18px;
    font-family:'Poppins',sans-serif;
}


textarea{
    height:100px;
    resize:none;
}


input:focus,
textarea:focus,
select:focus{
    border-color:#485331;
}


.attendance{
    display:flex;
    gap:10px;
    margin-top:10px;
}


.attendance button{

    flex:1;
    padding:13px;
    border-radius:12px;
    border:1px solid #485331;
    background:white;
    color:#485331;
    cursor:pointer;
    font-size:14px;
}


.attendance button.active{

    background:#485331;
    color:white;
}


.submit-btn{

    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#485331;
    color:white;
    font-size:15px;
    cursor:pointer;
}


.message{

    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#f1f4e9;
    text-align:center;
    color:#485331;
    font-size:14px;
}

</style>

</head>


<body>


<div class="rsvp-card">

<h1>RSVP</h1>

<div class="subtitle">
We would love to celebrate with you
</div>


<form id="rsvpForm">


<label>Full Name</label>

<input 
type="text" 
id="name"
placeholder="Enter your full name"
required>


<label>Guest Wall</label>

<textarea 
id="message"
placeholder="Write your message or wishes">
</textarea>


<label>Number of Guests</label>

<select id="guests">

<option value="1">1 Guest</option>
<option value="2">2 Guests</option>
<option value="3">3 Guests</option>
<option value="4">4 Guests</option>

</select>


<label>Attendance</label>

<div class="attendance">

<button 
type="button" 
onclick="selectAttend(this,'Attend')">
Attend
</button>


<button 
type="button" 
onclick="selectAttend(this,'Not Attend')">
Not Attend
</button>

</div>


<input type="hidden" id="status">


<button class="submit-btn">
Submit RSVP
</button>


</form>


<div class="message" id="result">

Thank you for your confirmation 🤍

</div>


</div>



<script>

let selectedStatus="";


function selectAttend(button,status){

    document.querySelectorAll('.attendance button')
    .forEach(btn=>{
        btn.classList.remove('active');
    });


    button.classList.add('active');

    selectedStatus=status;

    document.getElementById("status").value=status;

}



document.getElementById("rsvpForm")
.addEventListener("submit",function(e){

e.preventDefault();


if(selectedStatus===""){

alert("Please select Attend or Not Attend");

return;

}


document.getElementById("result").style.display="block";


this.style.display="none";


});

</script>


</body>
</html>
