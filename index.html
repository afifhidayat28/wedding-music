<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afif & Windi Wedding</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family: Georgia, serif;
    background:#fff8f0;
    color:#6b5138;

}


.hero{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:30px;

    background:
    linear-gradient(
    rgba(255,248,240,0.85),
    rgba(255,248,240,0.85)
    ),
    url("https://images.unsplash.com/photo-1519741497674-611481863552");

    background-size:cover;
    background-position:center;

}


.content h1{

    font-size:60px;

    margin-bottom:20px;

}


.content h2{

    font-size:30px;

    font-weight:normal;

}



.content p{

    font-size:20px;

    margin-top:25px;

    line-height:1.6;

}



.divider{

    margin:30px auto;

    width:100px;

    height:2px;

    background:#6b5138;

}



.music-control{

    margin-top:40px;

}



button{

    padding:12px 30px;

    border:none;

    border-radius:30px;

    background:#6b5138;

    color:white;

    font-size:16px;

}



</style>

</head>


<body>



<div class="hero">


<div class="content">


<h1>
Afif & Windi
</h1>


<h2>
Wedding Invitation
</h2>


<div class="divider"></div>


<p>
18 October 2026
</p>


<p>
Together with love,<br>
we invite you to celebrate<br>
our special day
</p>



<div class="music-control">

<button onclick="toggleMusic()" id="musicBtn">
🔊 Music
</button>

</div>


</div>


</div>




<audio id="music" autoplay loop>

<source src="Timur.mp3" type="audio/mpeg">

</audio>




<script>


const music = document.getElementById("music");



window.addEventListener("load",()=>{

    music.volume = 1;

});



function toggleMusic(){


    if(music.paused){

        music.play();

        document.getElementById("musicBtn").innerHTML="🔊 Music";

    }

    else{

        music.pause();

        document.getElementById("musicBtn").innerHTML="🔇 Pause";

    }


}


</script>



</body>

</html>
