<!DOCTYPE html>
<html>
<head>
<title>Wedding Music Test</title>
</head>

<body style="text-align:center;padding-top:100px;">

<h1>Afif & Windi</h1>

<button onclick="playMusic()" style="font-size:25px;padding:20px;">
OPEN INVITATION
</button>

<audio id="music" loop>
    <source src="./Timur.mp3" type="audio/mpeg">
</audio>


<script>

function playMusic(){

    let audio = document.getElementById("music");

    audio.load();

    audio.play()
    .then(()=>{
        alert("MUSIC PLAYING");
    })
    .catch((error)=>{
        alert("ERROR: " + error);
    });

}

</script>


</body>
</html>
