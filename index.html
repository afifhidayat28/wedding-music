<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afif & Windi Wedding</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family: "Georgia", serif;
    overflow:hidden;

}


/* PAGE */

.page{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

}



/* PAGE 1 */

#page1{

    background:
    linear-gradient(
    rgba(255,250,245,0.8),
    rgba(255,250,245,0.8)
    ),
    url("https://images.unsplash.com/photo-1519741497674-611481863552");

    background-size:cover;
    background-position:center;

}



.invitation{

    color:#6b5138;

}



.invitation h1{

    font-size:55px;
    margin-bottom:20px;

}



.invitation p{

    font-size:22px;
    margin-bottom:40px;

}



button{

    padding:18px 45px;

    border:none;

    border-radius:50px;

    background:#6b5138;

    color:white;

    font-size:20px;

    cursor:pointer;

}



button:hover{

    opacity:0.8;

}




/* PAGE 2 */


#page2{

    display:none;

    background:#fffaf5;

}



.content{

    color:#6b5138;

}



.content h1{

    font-size:60px;

}



.content h2{

    font-size:30px;

    margin-top:20px;

}



.content p{

    margin-top:30px;

    font-size:20px;

}



.music-icon{

    margin-top:40px;

    font-size:50px;

    animation:spin 3s linear infinite;

}



@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}


</style>


</head>



<body>



<!-- PAGE 1 -->

<div id="page1" class="page">


<div class="invitation">


<h1>
Wedding Invitation
</h1>


<p>
The Wedding of<br>
<strong>Afif & Windi</strong>
</p>


<button onclick="openInvitation()">

💌 Open Invitation

</button>


</div>


</div>





<!-- PAGE 2 -->

<div id="page2" class="page">


<div class="content">


<h1>
Afif & Windi
</h1>


<h2>
Together With Love
</h2>


<p>
We invite you to celebrate our special day
</p>


<div class="music-icon">
🎵
</div>


</div>


</div>





<!-- MUSIC -->

<audio id="music" loop>

<source src="Timur.mp3" type="audio/mpeg">

</audio>




<script>


function openInvitation(){


    let music = document.getElementById("music");


    music.volume = 1;


    music.play();



    document.getElementById("page1").style.display="none";


    document.getElementById("page2").style.display="flex";


}



</script>




</body>

</html>
