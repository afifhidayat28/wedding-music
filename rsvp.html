<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding RSVP</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #faf7f2;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
}

h1, h2 {
    text-align: center;
    color: #485331;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-sizing: border-box;
}

textarea {
    height: 100px;
}

button {
    width: 100%;
    padding: 14px;
    background: #485331;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    opacity: 0.8;
}

.card {
    background: #f6f3ec;
    padding: 15px;
    border-radius: 12px;
    margin-top: 10px;
}

.nama {
    font-weight: bold;
    color: #485331;
}

.loading {
    text-align: center;
}

</style>

</head>


<body>


<div class="container">

<h1>RSVP</h1>

<form id="rsvpForm">

<input 
type="text" 
name="nama"
placeholder="Nama Anda"
required>


<select name="kehadiran" required>

<option value="">
Konfirmasi Kehadiran
</option>

<option value="Hadir">
Hadir
</option>

<option value="Tidak Hadir">
Tidak Hadir
</option>

</select>


<textarea
name="ucapan"
placeholder="Tulis ucapan untuk pengantin..."
required></textarea>


<button type="submit">
Kirim RSVP
</button>


</form>


<h2>Ucapan Tamu</h2>


<div id="messages" class="loading">
Memuat ucapan...
</div>


</div>




<script>


// LINK GOOGLE APPS SCRIPT KAMU
const scriptURL = 
"https://script.google.com/macros/s/AKfycbwON9PBCqJ2N6J78SWCk4Ota6XogoB7tdcLNmRzCPHoouX_cRC2-RuG2MldfoUn2WA/exec";



const form = document.getElementById("rsvpForm");



form.addEventListener("submit", function(e){

e.preventDefault();


fetch(scriptURL, {

method: "POST",

body: new FormData(form)

})

.then(response => {

alert("RSVP berhasil dikirim ❤️");

form.reset();

loadMessages();

})

.catch(error => {

alert("Gagal mengirim RSVP");

console.log(error);

});


});





function loadMessages(){


fetch(scriptURL)

.then(response => response.json())

.then(data => {


let html = "";


data.reverse().forEach(item => {


html += `

<div class="card">

<div class="nama">
${item.nama}
</div>

<div>
${item.kehadiran}
</div>

<p>
${item.ucapan}
</p>

</div>

`;



});


document.getElementById("messages").innerHTML = html;


})

.catch(error => {


document.getElementById("messages").innerHTML =
"Gagal memuat ucapan";


});


}



loadMessages();



</script>


</body>
</html>
