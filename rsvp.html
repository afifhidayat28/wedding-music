<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RSVP</title>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #faf7f2;
}

.container {
    max-width: 400px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
}

h2 {
    text-align: center;
    color: #485331;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 5px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    box-sizing: border-box;
}

textarea {
    height: 90px;
}

.button-group {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #485331;
    background: white;
    color: #485331;
    cursor: pointer;
}

button.selected {
    background: #485331;
    color: white;
}

.submit {
    width: 100%;
    margin-top: 20px;
    background: #485331;
    color: white;
}

</style>

</head>

<body>

<div class="container">

<h2>RSVP</h2>

<label>Full Name</label>
<input type="text" placeholder="Your name">

<label>Guest Wall</label>
<textarea placeholder="Write your message"></textarea>

<label>Number of Guests</label>
<select>
    <option>1 Guest</option>
    <option>2 Guests</option>
    <option>3 Guests</option>
    <option>4 Guests</option>
</select>

<label>Attendance</label>

<div class="button-group">
    <button onclick="choose(this)">Attend</button>
    <button onclick="choose(this)">Not Attend</button>
</div>

<button class="submit">
Submit RSVP
</button>

</div>


<script>

function choose(btn){
    document.querySelectorAll(".button-group button")
    .forEach(b => b.classList.remove("selected"));

    btn.classList.add("selected");
}

</script>

</body>
</html>
